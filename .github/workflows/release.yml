name: Release Android

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Grant Execute Permission to Gradlew
        run: cd android && chmod +x gradlew

      - name: Build Android Release APK
        env:
          # Only the auth token is secret. It is read from the repository
          # Actions secret and never written to the repo. android/sentry.properties
          # is gitignored, so CI relies on these variables for org/project/url.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: wrapple
          SENTRY_PROJECT: vibedownloader-android
          SENTRY_URL: https://sentry.io
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: List Build Outputs
        run: ls -R android/app/build/outputs/apk/

      - name: Rename APKs with Version
        run: |
          cd android/app/build/outputs/apk/release
          for file in *.apk; do
            # Extract architecture from filename (e.g., app-arm64-v8a-release.apk -> arm64-v8a)
            arch=$(echo "$file" | sed 's/app-//g' | sed 's/-release.apk//g')
            mv "$file" "VibeDownloader-${{ github.ref_name }}-${arch}.apk"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false
          body: |
            ## 📥 VibeDownloader Android ${{ github.ref_name }}

            ### ✨ New
            - 📡 **Redesigned offline screen**: Clearer "no internet" card with a one-tap "Try again" to re-check your connection, and a cleaner offline pill at the top of Home

            ### 🐛 Fixed
            - 💥 **Crash fixes for several out-of-memory crashes**: downloading or probing a large playlist/channel no longer buffers unbounded output in memory, and scrolling Home no longer creates a new animated node on every frame

            ### 📦 Download Guide
            Choose the correct APK for your device:
            - **arm64-v8a** (Recommended) — For most modern Android phones (last 5–6 years)
            - **armeabi-v7a** — For older or low-end Android devices
            - **universal** — Works on ALL devices (larger file size) and emulators
            - **x86_64 / x86** — Primarily for emulators or specific tablets

            ---
            Requires Android 7.0 (API 24) or newer.
            **Full Changelog**: https://github.com/naeem5877/vibedownloader-android/compare/v2.2.0...${{ github.ref_name }}

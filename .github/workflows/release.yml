name: Release Android

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Grant Execute Permission to Gradlew
        run: cd android && chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: List Build Outputs
        run: ls -R android/app/build/outputs/apk/

      - name: Rename APKs with Version
        run: |
          cd android/app/build/outputs/apk/release
          for file in *.apk; do
            # Extract architecture from filename (e.g., app-arm64-v8a-release.apk -> arm64-v8a)
            arch=$(echo "$file" | sed 's/app-//g' | sed 's/-release.apk//g')
            mv "$file" "VibeDownloader-${{ github.ref_name }}-${arch}.apk"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false
          body: |
            ## 🚀 VibeDownloader Mobile ${{ github.ref_name }}

            ### 🎬 YouTube Upgrades
            - **Subtitles Download**: Videos with captions now show a **Subtitles** option. Pick a language and save the subtitles as an SRT file
            - **Multi-Language Audio Tracks**: Choose the exact audio track you want (Bangla, English, Hindi, and more)
            - **Audio or Video in Your Language**: Download the selected language as an audio file, or as a video with that audio track
            - **Smarter Format Detection**: If the quality list looks incomplete, the app retries with a different player before showing results

            ### 🎵 Lyrics Download (Spotify & YouTube Music)
            - **Line by Line** synced lyrics, **Word by Word** karaoke-style timing, **Plain Text**, and **translated** versions

            ### 🎧 Music Downloading
            - **WAV Format Added**: Download songs as uncompressed WAV for the highest audio fidelity
            - **Better Metadata Embedding**: Downloaded songs now include track, album and artist details
            - **Spotify: 4 Audio Formats** to choose from

            ### 📸 Stories
            - **Instagram Stories Fixed** and **Facebook Stories Fixed**: story downloading works again

            ### 🛡️ Bot Protection & Age Restriction
            - **Automatic Player Fallback**: if one YouTube player is refused, the app tries another instead of erroring
            - **Improved YouTube Reliability**: fewer bot-protection and age-restriction errors
            - **Better Error Messages**: reads the real reason yt-dlp reports
            - **Stuck Requests Cancelled Properly**: a timed-out request now stops the downloader process
            - **More Secure Connections**: removed the setting that skipped certificate checks

            ### 🧰 Diagnostics & Debugging
            - **Sentry Error Reporting** to find and fix crashes faster, with links and file paths scrubbed before anything is sent
            - **Private Logs**: video links are redacted from logs
            - **`ffmpeg` & `ffprobe` Fixed**: post-processing tools are found reliably on every supported ABI
            - **16 KB Page Size Support** for modern Android devices

            ### 🖼️ Library
            - **Real Thumbnails**: cover art is read from the file's embedded metadata, and video posters are generated by the app

            ### 📦 Download Guide
            Choose the correct APK for your device:
            - **arm64-v8a** (Recommended) - For most modern Android phones (last 5-6 years)
            - **armeabi-v7a** - For older or low-end Android devices
            - **universal** - Works on ALL devices (but larger file size) and emulators
            - **x86_64 / x86** - Primarily for emulators or specific tablets

            ---
            Requires Android 7.0 (API 24) or newer.
            **Full details**: https://github.com/naeem5877/vibedownloader-android#%F0%9F%86%80-whats-new-in-v200
            **Full Changelog**: https://github.com/naeem5877/vibedownloader-android/compare/v1.3.0...${{ github.ref_name }}

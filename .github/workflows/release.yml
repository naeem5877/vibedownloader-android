name: Release Android

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Grant Execute Permission to Gradlew
        run: cd android && chmod +x gradlew

      - name: Build Android Release APK
        env:
          # Only the auth token is secret. It is read from the repository
          # Actions secret and never written to the repo. android/sentry.properties
          # is gitignored, so CI relies on these variables for org/project/url.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: wrapple
          SENTRY_PROJECT: vibedownloader-android
          SENTRY_URL: https://sentry.io
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: List Build Outputs
        run: ls -R android/app/build/outputs/apk/

      - name: Rename APKs with Version
        run: |
          cd android/app/build/outputs/apk/release
          for file in *.apk; do
            # Extract architecture from filename (e.g., app-arm64-v8a-release.apk -> arm64-v8a)
            arch=$(echo "$file" | sed 's/app-//g' | sed 's/-release.apk//g')
            mv "$file" "VibeDownloader-${{ github.ref_name }}-${arch}.apk"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false
          body: |
            ## ????????? VibeDownloader Android ${{ github.ref_name }}

            ### ?????? New
            - ???????? **Cleaner onboarding**: A simpler, friendlier first-run introduction
            - ????????? **Batch Download redesign**: Link list with platform colours, remove single links, paste more, live progress while links are checked, and a Stop button
            - ?????????? **Real update details**: The update dialog now shows the full release notes with headings, bullets and links, the release date, and the size of the APK that fits your phone
            - ?????????? **What's new after updating**: After an update the app shows that version's release notes, fetched straight from GitHub
            - ?????? **Faster YouTube loading**: Video formats load without the long wait. A built-in JavaScript engine now solves YouTube's checks on the phone, so the app no longer needs a slow second attempt
            - ????????? **Offline mode that works**: When you lose connection the app shows an offline banner and a "Network Interrupted" screen with a shortcut to your Library, and returns to normal as soon as you reconnect
            
            ### ???????? Fixed
            - ????????? **Endless "update available"**: The app compared against a version baked into the code, so it kept asking you to update even on the latest version. It now reads the version that is really installed
            - ????????? **Wrong APK offered**: Updates now download the build that matches your device (arm64-v8a, armeabi-v7a, x86 or x86_64) instead of always the universal file
            - ????????????? **Trim handles**: Dragging the clip handles no longer swipes the Download and Library screens instead
            - ?????????????? **ffmpeg "cannot start on this device"**: Clip trimming and merging now start correctly on normal phones, including newer Android devices that use 16 KB memory pages
            - ?????? **X (Twitter) links**: Buttons and text on X links were white on white. They are now readable
            - ???????? **Sentry noise**: Removed harmless red error screens caused by Sentry's own debug logging in development builds
            
            ### ????????? Download Guide
            Choose the correct APK for your device:
            - **arm64-v8a** (Recommended) ???????? For most modern Android phones (last 5????????6 years)
            - **armeabi-v7a** ???????? For older or low-end Android devices
            - **universal** ???????? Works on ALL devices (larger file size) and emulators
            - **x86_64 / x86** ???????? Primarily for emulators or specific tablets

            ---
            Requires Android 7.0 (API 24) or newer.
            **Full Changelog**: https://github.com/naeem5877/vibedownloader-android/compare/v2.0.0...${{ github.ref_name }}

name: Release Android

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Grant Execute Permission to Gradlew
        run: cd android && chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: List Build Outputs
        run: ls -R android/app/build/outputs/apk/

      - name: Rename APKs with Version
        run: |
          cd android/app/build/outputs/apk/release
          for file in *.apk; do
            # Extract architecture from filename (e.g., app-arm64-v8a-release.apk -> arm64-v8a)
            arch=$(echo "$file" | sed 's/app-//g' | sed 's/-release.apk//g')
            mv "$file" "VibeDownloader-${{ github.ref_name }}-${arch}.apk"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false
          body: |
            ## 🚀 VibeDownloader Android ${{ github.ref_name }}

            ### ✨ What's New
            - 🎬 **Subtitles Download**: Videos with captions now show a **Subtitles** option. Pick any language and save the subtitles as an SRT file
            - 🗣️ **Multi-Language Audio Tracks**: If a video has more than one audio track (Bangla, English, Hindi, dubbed and AutoTranslate), you can now choose the exact language you want
            - 🎧 **Audio or Video in Your Language**: Download the selected language as an audio file, or as a video with that audio track
            - 🔍 **Smarter Format Detection**: The app checks the quality list YouTube returns. If it looks incomplete (for example only 360p), it retries with a different player before showing results
            - ⚡ **Faster Metadata**: Titles, formats, thumbnails, subtitles and audio tracks resolve straight from YouTube's player response, so most links load dramatically faster. yt-dlp is still used as a fallback, and for every real download
            - 🛡️ **Automatic Player Fallback**: If one YouTube player is refused, the app tries another instead of erroring — fixing most "bot protection" and age-restriction failures
            - 🎵 **Lyrics Download**: New lyrics section for Spotify and YouTube Music — line by line synced, word by word karaoke timing, plain text, or translated
            - 🎼 **WAV Format Added**: Download songs as uncompressed WAV for the highest audio fidelity
            - 🏷️ **Better Metadata Embedding**: Downloaded songs now include track, album and artist details, so they show up correctly in your music player
            - 🎛️ **Spotify: 4 Audio Formats**: Spotify downloads now offer four audio format options
            - 🖼️ **Real Cover Art**: The library reads cover art from the file's embedded metadata and generates video posters itself, so previews finally match what you downloaded
            - ✂️ **Clip Trimmer**: Trim any video or song with the timeline editor before saving — clean output, no leftovers
            - 📦 **Batch Queue**: Queue multiple videos and audio with per-item quality controls, then watch progress on each one
            - 🔴 **Twitch Support**: Added Twitch to the platform selector, with live recording you can stop and finalize any time
            - 📸 **Stories Fixed**: Instagram and Facebook story downloading works again
            - 🗂️ **Library Overhaul**: Rebuilt as a gallery with real thumbnails, bulk delete, platform chips, and app-private storage downloads now listed correctly
            - ⚡ **Live Library Refresh**: The library updates as downloads finish instead of needing a manual refresh
            - 🎨 **Interface Refresh**: Reworked bottom navigation animation, tab swipe that actually tracks your finger, drag-tracked depth transitions, a new splash screen, refreshed platform icons and an improved update flow
            - 🐛 **Stuck Requests Cancelled Properly**: A timed-out request now stops the downloader process instead of leaving it running in the background
            - 💬 **Better Error Messages**: The app reads the real reason yt-dlp reports, so you see a clearer message when something goes wrong
            - 🔒 **More Secure Connections**: Removed the setting that skipped certificate checks
            - 🧰 **Sentry Error Reporting**: Optional crash reporting to find and fix bugs faster. Links and file paths are scrubbed before anything is sent, and video links are redacted from logs
            - 🛠️ **ffmpeg & ffprobe Fixed**: Post-processing tools are now found reliably on every supported ABI instead of silently skipping conversion
            - 📐 **16 KB Page Size Support**: Native libraries updated so the app runs correctly on modern 16 KB page size devices
            - 💪 **Stability Fixes**: Fixed audio downloads that could hang, fixed album art being mislabelled, stopped leaked animation loops, and applied the JS runtime once per request

            ### 📦 Download Guide
            Choose the correct APK for your device:
            - **arm64-v8a** (Recommended) — For most modern Android phones (last 5–6 years)
            - **armeabi-v7a** — For older or low-end Android devices
            - **universal** — Works on ALL devices (larger file size) and emulators
            - **x86_64 / x86** — Primarily for emulators or specific tablets

            ---
            Requires Android 7.0 (API 24) or newer.
            **Full Changelog**: https://github.com/naeem5877/vibedownloader-android/compare/v1.3.0...${{ github.ref_name }}
